<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELOMAX — 페이지 이동 중</title>
    <script>
      /**
       * [기능] GitHub Pages 루트 사이트(https://kimdy031-glitch.github.io/) 404 폴백 리다이렉트
       * [원리] VELOMAX는 해시 라우팅(#/dashboard, #/measure 등)을 사용합니다.
       *        사용자가 해시(#) 없이 직접 하위 경로(예: https://kimdy031-glitch.github.io/measure)에
       *        접속하거나 새로고침하여 404가 발생하면 루트('/') + 해시 경로('#/measure')로 변환하여
       *        SPA 진입점(index.html)이 정상적으로 열리도록 복구합니다.
       */
      (function () {
        var l = window.location;
        var cleanRoute = l.pathname.replace(/^\/+|\/+$/g, '');
        var targetHash = l.hash || (cleanRoute ? '#/' + cleanRoute : '');
        l.replace(l.protocol + '//' + l.host + '/' + l.search + targetHash);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 24px; color: #334155;">
      VELOMAX 페이지로 이동 중입니다...
    </p>
  </body>
</html>
